---
project_name: orynx

release:
  github:
    owner: agex-labs
    name: orynx
  prerelease: true

builds:
  - main: 'cmd/orynx/main.go'
    goos:
    - 'linux'
    - 'darwin'
    binary: 'orynx'
    id: 'orynx'
    ldflags:
      - "-X github.com/agex-labs/orynx/cmd/build.Build={{.Version}}"
archives:
  - format: tar.gz
    wrap_in_directory: true
    format_overrides:
      - goos: windows
        format: zip
    name_template: "{{ .Binary }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    files:
      - README.md

snapshot:
  name_template: SNAPSHOT-{{ .Commit }}

changelog:
  skip: false
  use: 'github'

checksum:
  disable: false
